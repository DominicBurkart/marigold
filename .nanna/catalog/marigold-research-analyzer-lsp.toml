[identity]
name = "marigold-research-analyzer-lsp"
description = "Read-only researcher for the marigold analyzer and language server area."
loop = "middle"
model = "gemma4:e4b"
system_prompt = "prompts/marigold-research-analyzer-lsp.md"

[scope]
repos = ["github.com/DominicBurkart/marigold"]
paths = []
read_paths = ["marigold-lsp/**", "tests/**", "Cargo.toml", "marigold-grammar/src/diagnostics.rs", "marigold-grammar/src/line_index.rs", "marigold-grammar/src/node_ids.rs", "marigold-grammar/src/recovery.rs", "marigold-grammar/src/remap.rs", "marigold-grammar/src/resolver.rs", "marigold-grammar/src/rustc_json.rs", "marigold-grammar/src/source_map.rs", "marigold-grammar/src/span_index.rs", "marigold-grammar/src/sub_spans.rs", "marigold-grammar/src/symbol_table.rs", "marigold-grammar/src/symbols.rs", "marigold-grammar/src/complexity.rs"]
max_effect = "none"
tools = ["read_file", "list_directory", "search", "git_status", "git_diff"]

[limits]
max_iterations = 200
max_wall_clock_secs = 3600
max_concurrent = 1

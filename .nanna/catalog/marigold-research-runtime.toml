[identity]
name = "marigold-research-runtime"
description = "Read-only researcher for the marigold runtime area."
loop = "middle"
model = "gemma4:e4b"
system_prompt = "prompts/marigold-research-runtime.md"

[scope]
repos = ["github.com/DominicBurkart/marigold"]
paths = []
read_paths = ["marigold-impl/**", "marigold/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock"]
max_effect = "none"
tools = ["read_file", "list_directory", "search", "git_status", "git_diff"]

[limits]
max_iterations = 200
max_wall_clock_secs = 3600
max_concurrent = 1

[identity]
name = "marigold-bugfix-implementer"
description = "Fixes a bug red then green: failing regression test first, then the minimal fix."
loop = "inner"
model = "gemma4:e4b"
system_prompt = "prompts/marigold-bugfix-implementer.md"

[scope]
repos = ["github.com/DominicBurkart/marigold"]
paths = ["marigold/**", "marigold-macros/**", "marigold-grammar/**", "marigold-lsp/**", "marigold-impl/**", "tests/**"]
read_paths = ["marigold/**", "marigold-macros/**", "marigold-grammar/**", "marigold-lsp/**", "marigold-impl/**", "tests/**", "examples/**", "integrations/**", "docs/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "deny.toml", "codecov.yml", "README.md", "install.sh", "publish.sh"]
max_effect = "workspace"
tools = ["read_file", "list_directory", "search", "git_status", "git_diff", "write_file", "cargo_check", "cargo_test", "cargo_build"]

[limits]
max_iterations = 200
max_wall_clock_secs = 3600
max_concurrent = 1

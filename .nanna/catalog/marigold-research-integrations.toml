[identity]
name = "marigold-research-integrations"
description = "Read-only researcher for the marigold integrations area."
loop = "middle"
model = "gemma4:e4b"
system_prompt = "prompts/marigold-research-integrations.md"

[scope]
repos = ["github.com/DominicBurkart/marigold"]
paths = []
read_paths = ["integrations/**", "install.sh", "publish.sh", "Cargo.toml"]
max_effect = "none"
tools = ["read_file", "list_directory", "search", "git_status", "git_diff"]

[limits]
max_iterations = 200
max_wall_clock_secs = 3600
max_concurrent = 1

[identity]
name = "marigold-research-integrations"
description = "Researcher for the marigold integrations area; writes its findings to docs/research/integrations.txt only."
loop = "middle"
model = "gemma4:e4b"
system_prompt = "prompts/marigold-research-integrations.md"

[scope]
repos = ["github.com/DominicBurkart/marigold"]
paths = ["docs/research/integrations.txt"]
read_paths = ["integrations/**", "install.sh", "publish.sh", "Cargo.toml"]
max_effect = "workspace"
tools = ["read_file", "list_directory", "search", "git_status", "git_diff", "write_file"]

[limits]
max_iterations = 200
max_wall_clock_secs = 3600
max_concurrent = 1

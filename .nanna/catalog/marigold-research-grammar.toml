[identity]
name = "marigold-research-grammar"
description = "Read-only researcher for the marigold front end area."
loop = "middle"
model = "gemma4:e4b"
system_prompt = "prompts/marigold-research-grammar.md"

[scope]
repos = ["github.com/DominicBurkart/marigold"]
paths = []
read_paths = ["marigold-grammar/**", "marigold-macros/**", "marigold/**", "tests/**", "Cargo.toml"]
max_effect = "none"
tools = ["read_file", "list_directory", "search", "git_status", "git_diff"]

[limits]
max_iterations = 200
max_wall_clock_secs = 3600
max_concurrent = 1

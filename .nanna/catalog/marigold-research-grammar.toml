[identity]
name = "marigold-research-grammar"
description = "Researcher for the marigold front end area; writes its findings to docs/research/grammar.txt only."
loop = "middle"
model = "gemma4:e4b"
system_prompt = "prompts/marigold-research-grammar.md"

[scope]
repos = ["github.com/DominicBurkart/marigold"]
paths = ["docs/research/grammar.txt"]
read_paths = ["marigold-grammar/**", "marigold-macros/**", "marigold/**", "tests/**", "Cargo.toml"]
max_effect = "workspace"
tools = ["read_file", "list_directory", "search", "git_status", "git_diff", "write_file"]

[limits]
max_iterations = 200
max_wall_clock_secs = 3600
max_concurrent = 1

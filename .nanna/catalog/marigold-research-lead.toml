[identity]
name = "marigold-research-lead"
description = "Turns a research question into sub-questions and sources; writes only docs/research."
loop = "middle"
model = "gemma4:e4b"
system_prompt = "prompts/marigold-research-lead.md"

[scope]
repos = ["github.com/DominicBurkart/marigold"]
paths = ["docs/research/**"]
read_paths = ["marigold/**", "marigold-macros/**", "marigold-grammar/**", "marigold-lsp/**", "marigold-impl/**", "tests/**", "examples/**", "integrations/**", "docs/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "deny.toml", "codecov.yml", "README.md", "install.sh", "publish.sh"]
max_effect = "workspace"
tools = ["read_file", "list_directory", "search", "git_status", "git_diff", "write_file"]

[limits]
max_iterations = 150
max_wall_clock_secs = 3600
max_concurrent = 1

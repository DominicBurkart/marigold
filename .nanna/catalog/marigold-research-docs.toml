[identity]
name = "marigold-research-docs"
description = "Researcher for the marigold documentation area; writes its findings to docs/research/docs.txt only."
loop = "middle"
model = "gemma4:e4b"
system_prompt = "prompts/marigold-research-docs.md"

[scope]
repos = ["github.com/DominicBurkart/marigold"]
paths = ["docs/research/docs.txt"]
read_paths = ["docs/**", "README.md", "marigold/README.md", "marigold-grammar/docs/**", "examples/**", "Cargo.toml"]
max_effect = "workspace"
tools = ["read_file", "list_directory", "search", "git_status", "git_diff", "write_file"]

[limits]
max_iterations = 200
max_wall_clock_secs = 3600
max_concurrent = 1

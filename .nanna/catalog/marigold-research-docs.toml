[identity]
name = "marigold-research-docs"
description = "Read-only researcher for the marigold documentation area."
loop = "middle"
model = "gemma4:e4b"
system_prompt = "prompts/marigold-research-docs.md"

[scope]
repos = ["github.com/DominicBurkart/marigold"]
paths = []
read_paths = ["docs/**", "README.md", "marigold/README.md", "marigold-grammar/docs/**", "examples/**", "Cargo.toml"]
max_effect = "none"
tools = ["read_file", "list_directory", "search", "git_status", "git_diff"]

[limits]
max_iterations = 200
max_wall_clock_secs = 3600
max_concurrent = 1

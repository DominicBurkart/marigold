[identity]
name = "marigold-feature-designer"
description = "Implements a new journey-based interface test-first in the marigold crates."
loop = "inner"
model = "gemma4:e4b"
system_prompt = { inline = "You implement one feature test-first under the marigold crates and tests. Never touch examples, CI, manifests, publish.sh, install.sh or the nanna and inchworm configuration. No network, release or deploy actions. Add no code comments." }

[scope]
repos = ["github.com/DominicBurkart/marigold"]
paths = ["marigold/**", "marigold-macros/**", "marigold-grammar/**", "marigold-lsp/**", "marigold-impl/**", "tests/**"]
read_paths = ["marigold/**", "marigold-macros/**", "marigold-grammar/**", "marigold-lsp/**", "marigold-impl/**", "tests/**", "examples/**", "integrations/**", "docs/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "deny.toml", "README.md"]
max_effect = "workspace"
tools = ["read_file", "list_directory", "search", "git_status", "git_diff", "write_file", "cargo_check", "cargo_test", "cargo_build"]

[limits]
max_iterations = 100
max_wall_clock_secs = 1800
max_concurrent = 1

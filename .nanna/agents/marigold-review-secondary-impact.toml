[identity]
name = "marigold-review-secondary-impact"
description = "Finds secondary and downstream impact of a change on other crates, public API, performance, docs and the LSP and analyzer."
loop = "middle"
model = "gemma4:e4b"
system_prompt = { inline = "You are an adversarial reviewer for SECONDARY IMPACT. Trace what depends on the changed code: other workspace crates, the public API and semver, generated code from the macros, performance and allocation behaviour on hot stream paths, documentation and examples, and the language server and analyzer (spans, diagnostics, symbols). Report each affected place with file and line and why. End with VERDICT: NO_IMPACT or VERDICT: IMPACT. You cannot write files or run commands." }

[scope]
repos = ["github.com/DominicBurkart/marigold"]
paths = []
read_paths = ["marigold/**", "marigold-macros/**", "marigold-grammar/**", "marigold-lsp/**", "marigold-impl/**", "tests/**", "examples/**", "integrations/**", "docs/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "deny.toml", "README.md"]
max_effect = "none"
tools = ["read_file", "list_directory", "search", "git_status", "git_diff"]

[limits]
max_iterations = 60
max_wall_clock_secs = 900
max_concurrent = 1

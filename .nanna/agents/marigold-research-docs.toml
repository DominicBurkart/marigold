[identity]
name = "marigold-research-docs"
description = "Read-only researcher for the marigold documentation area."
loop = "middle"
model = "gemma4:e4b"
system_prompt = { inline = "You are a read-only code researcher for the marigold documentation: docs, READMEs, grammar docs and the examples. Answer the question in the task by reading code: cite file and line, state nothing you did not read, and say plainly what you could not find or verify. Never claim to have run anything. You cannot write files or run commands. Your answer is returned as your final message." }

[scope]
repos = ["github.com/DominicBurkart/marigold"]
paths = []
read_paths = ["docs/**", "README.md", "marigold/README.md", "examples/**"]
max_effect = "none"
tools = ["read_file", "list_directory", "search", "git_status", "git_diff"]

[limits]
max_iterations = 60
max_wall_clock_secs = 900
max_concurrent = 1

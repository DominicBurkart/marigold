[identity]
name = "marigold-bugfix-implementer"
description = "Fixes a bug red then green: failing regression test first, then the minimal fix."
loop = "inner"
model = "gemma4:e4b"
system_prompt = { inline = "Fix the bug in the task or plan in this order. First write a regression test that fails for the reported reason and run cargo_test to see it fail. Then make the smallest production change that turns it green, and run cargo_check and cargo_test for the touched crate. Do not refactor, rename or reformat unrelated code. You cannot edit any Cargo.toml, so report a needed dependency instead of adding it. Keep README.md and marigold/README.md identical by reporting a needed change instead. Add no code comments." }

[scope]
repos = ["github.com/DominicBurkart/marigold"]
paths = ["marigold/**", "marigold-macros/**", "marigold-grammar/**", "marigold-lsp/**", "marigold-impl/**", "tests/**"]
read_paths = ["marigold/**", "marigold-macros/**", "marigold-grammar/**", "marigold-lsp/**", "marigold-impl/**", "tests/**", "examples/**", "integrations/**", "docs/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "deny.toml", "README.md"]
max_effect = "workspace"
tools = ["read_file", "list_directory", "search", "git_status", "git_diff", "write_file", "cargo_check", "cargo_test", "cargo_build"]

[limits]
max_iterations = 100
max_wall_clock_secs = 1800
max_concurrent = 1

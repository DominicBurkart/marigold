[identity]
name = "pr-shepherd"
description = "Commits finished work, pushes the branch and opens a draft pull request for marigold."
loop = "middle"
model = "gemma4:e4b"
system_prompt = { inline = "You publish work that is already written. Commit with a semantic message, push the branch, and open the pull request as a draft only. Never merge, never force push, never edit files." }

[scope]
repos = ["github.com/DominicBurkart/marigold"]
paths = []
read_paths = ["marigold/**", "marigold-macros/**", "marigold-grammar/**", "marigold-lsp/**", "marigold-impl/**", "tests/**", "examples/**", "integrations/**", "docs/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "deny.toml", "README.md"]
max_effect = "repository"
tools = ["read_file", "search", "git_status", "git_diff", "git_commit", "git_push_branch", "github_pr_open", "github_pr_comments"]

[limits]
max_iterations = 50
max_wall_clock_secs = 900
max_concurrent = 1

[identity]
name = "marigold-e2e-designer"
description = "Writes integration tests that follow real user journeys through the public marigold API."
loop = "inner"
model = "gemma4:e4b"
system_prompt = { inline = "Write end-to-end tests that follow an actual user journey through the public marigold interface: a program written in the DSL, run through the macro or runtime, with the observable output asserted. Name each test for the journey. Write it first and run cargo_test; it must pass against current code, otherwise report the divergence and stop without touching production code. Prefer the shapes already used in tests and examples. You cannot edit any Cargo.toml and so cannot add dependencies: the tests crate already has marigold, marigold-grammar, futures, tokio, async-std, proptest, serde, num-bigint and opentelemetry_sdk, and the features tokio, async-std, io, otel and otel-otlp. If a journey needs anything else, report that instead. Add no code comments." }

[scope]
repos = ["github.com/DominicBurkart/marigold"]
paths = ["tests/**"]
read_paths = ["marigold/**", "marigold-macros/**", "marigold-grammar/**", "marigold-lsp/**", "marigold-impl/**", "tests/**", "examples/**", "integrations/**", "docs/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "deny.toml", "README.md"]
max_effect = "workspace"
tools = ["read_file", "list_directory", "search", "git_status", "git_diff", "write_file", "cargo_check", "cargo_test"]

[limits]
max_iterations = 200
max_wall_clock_secs = 3600
max_concurrent = 1

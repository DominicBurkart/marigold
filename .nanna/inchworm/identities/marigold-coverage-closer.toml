[identity]
name = "marigold-coverage-closer"
description = "Closes remaining line coverage toward 100 percent once every ledger invariant has a covering test."
loop = "inner"
model = "gemma4:e4b"
system_prompt = "prompts/marigold-coverage-closer.md"

[scope]
repos = ["github.com/DominicBurkart/marigold"]
paths = ["marigold-impl/**", "marigold-grammar/**", "marigold/**", "tests/**"]
read_paths = ["marigold-impl/**", "marigold-grammar/**", "marigold-macros/**", "marigold/**", "tests/**", ".nanna/inchworm/**", "Cargo.toml", "codecov.yml", "README.md", "rust-toolchain.toml"]
max_effect = "workspace"
tools = ["read_file", "list_directory", "search", "git_status", "git_diff", "write_file", "cargo_check", "cargo_test"]

[limits]
max_iterations = 200
max_wall_clock_secs = 3600
max_concurrent = 1

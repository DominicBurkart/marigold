[[flow]]
name = "test-design"
trigger = { kind = "label", label = "inchworm:test-design" }
base = "main"
max_attempts = 3
retry_on = ["agent_failed", "tests_failed", "judge_rejected"]

[[flow.step]]
name = "scout"
identity = "marigold-invariant-scout"

[[flow.step]]
name = "design"
identity = "marigold-test-designer"

[[flow.judge]]
kind = "diff"
max_lines = 600
forbid_paths = [".github/**", ".inchworm/**", ".nanna/catalog/**", ".nanna/agents/**", ".nanna/inchworm/gate.py", "inchworm.toml", "codecov.yml", "deny.toml", "publish.sh", "install.sh", "Cargo.toml", "**/Cargo.toml", "examples/**"]

[[flow.judge]]
kind = "nanna_clean"

[flow.outcome]
mode = "draft_pr"
required_checks = ["Tests", "style hooks"]

[[flow]]
name = "close-coverage"
trigger = { kind = "label", label = "inchworm:coverage" }
base = "main"
max_attempts = 3
retry_on = ["agent_failed", "tests_failed", "judge_rejected"]

[[flow.step]]
name = "close"
identity = "marigold-coverage-closer"

[[flow.judge]]
kind = "diff"
max_lines = 600
forbid_paths = [".github/**", ".inchworm/**", ".nanna/**", "inchworm.toml", "codecov.yml", "deny.toml", "publish.sh", "install.sh", "Cargo.toml", "**/Cargo.toml", "examples/**"]

[[flow.judge]]
kind = "nanna_clean"

[flow.outcome]
mode = "draft_pr"
required_checks = ["Tests", "style hooks"]

[[flow]]
name = "prove"
trigger = { kind = "label", label = "inchworm:prove" }
base = "main"
max_attempts = 2
retry_on = ["agent_failed", "judge_rejected"]

[[flow.step]]
name = "prove"
identity = "marigold-kani-prover"

[[flow.judge]]
kind = "diff"
max_lines = 800
forbid_paths = [".github/**", ".inchworm/**", ".nanna/catalog/**", ".nanna/agents/**", ".nanna/inchworm/gate.py", "inchworm.toml", "codecov.yml", "deny.toml", "publish.sh", "install.sh", "Cargo.toml", "**/Cargo.toml", "examples/**"]

[[flow.judge]]
kind = "nanna_clean"

[flow.outcome]
mode = "draft_pr"
required_checks = ["Tests", "style hooks"]

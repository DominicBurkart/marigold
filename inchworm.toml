[[flow.judge]]
kind = "diff"
max_lines = 600
forbid_paths = ["publish.sh", ".github/**", ".inchworm/**", "inchworm.toml", "deny.toml", "codecov.yml", ".cargo-husky/**", "flake.nix", "flake.lock", ".devcontainer/**", ".nanna/**", "install.sh", "Cargo.toml", "**/Cargo.toml", "examples/**", "marigold/src/**", "marigold-*/src/**", "marigold-*/benches/**", "**/build.rs", "scripts/**"]

[[flow.judge]]
kind = "nanna_clean"

[flow.outcome]
mode = "draft_pr"
blocking = "required"

[[flow]]
name = "prove"
trigger = { kind = "label", label = "inchworm:prove" }
base = "main"
max_attempts = 2
retry_on = ["agent_failed", "judge_rejected"]

[[flow.step]]
name = "prove"

[[invariant]]
id = "check-ranges-in-bounds"
surface = "interface"
statement = "Every diagnostic range from marigold_check lies within the input, starts at or before its end, and falls on char boundaries, for any input."
status = "covered"
provable = "none"
covered_by = [
  "marigold-grammar/tests/check_diagnostics.rs::ranges_are_in_bounds_for_arbitrary_input",

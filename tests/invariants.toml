]

[[invariant]]
id = "analyze-accepts-whatever-parse-accepts"
surface = "interface"
statement = "Whenever marigold_parse returns Ok, marigold_analyze and marigold_stream_complexities return Ok; whenever either returns Err, marigold_parse returns Err. The converse is false: a program that redeclares a stream variable is rejected by marigold_parse and marigold_check but analyzed successfully."
status = "covered"
provable = "none"
covered_by = [
  "marigold-grammar/tests/interface_invariants.rs::analyze_and_stream_complexities_accept_every_program_parse_accepts",
  "marigold-grammar/tests/interface_invariants.rs::analyze_and_stream_complexities_reject_syntax_errors",
  "marigold-grammar/tests/interface_invariants.rs::parse_is_stricter_than_analyze_on_a_redeclared_stream_variable",
  "marigold-grammar/tests/interface_invariants.rs::parse_ok_implies_analyze_and_complexities_ok_on_arbitrary_text",
  "marigold-grammar/tests/interface_invariants.rs::parse_ok_implies_analyze_ok_on_mutated_programs",
]


[[invariant]]
id = "grammar-parse-total"
surface = "interface"
statement = "marigold_parse never panics on any input string; it returns Ok(code) or Err."
status = "covered"
provable = "none"
covered_by = [
  "marigold-grammar/tests/interface_invariants.rs::parse_never_panics_on_arbitrary_text",
  "marigold-grammar/tests/interface_invariants.rs::parse_never_panics_on_arbitrary_ascii_with_newlines",
  "marigold-grammar/tests/interface_invariants.rs::parse_never_panics_on_mutated_programs",
  "marigold-grammar/tests/interface_invariants.rs::parse_is_total_on_adversarial_inputs",
]

[[invariant]]
id = "grammar-check-agrees-with-parse"
surface = "interface"
statement = "For input of at most diagnostics::MAX_CHECK_INPUT_BYTES, marigold_check returns no error diagnostics exactly when marigold_parse returns Ok; larger input yields a single input-too-large error without being parsed."
status = "covered"
provable = "none"
covered_by = [
  "marigold-grammar/tests/check_diagnostics.rs::check_agrees_with_parse",
  "marigold-grammar/tests/check_diagnostics.rs::mutated_programs_have_valid_ranges_and_agree_with_parse",
  "marigold-grammar/tests/check_diagnostics.rs::oversized_input_is_rejected_with_a_single_bounded_diagnostic",
  "marigold-grammar/tests/check_diagnostics.rs::input_at_the_size_limit_is_still_checked",
  "marigold-grammar/tests/interface_invariants.rs::parse_is_total_on_adversarial_inputs",
]

[[invariant]]
id = "keep-first-n-bounded-descending"
surface = "interface"
statement = "KeepFirstN returns at most N items in descending order, and exactly the N largest by the comparator, with ties broken by earlier stream position."
status = "covered"
provable = "kani"
covered_by = [
  "marigold-impl/tests/keep_first_n_edge_cases.rs::keep_first_n_strictly_larger_arrival_does_not_evict_the_earlier_tied_item",
  "marigold-impl/tests/keep_first_n_edge_cases.rs::keep_first_n_matches_the_documented_tie_break_model_exhaustively",
  "marigold-impl/tests/keep_first_n_edge_cases.rs::keep_first_n_keeps_the_earliest_of_many_ties_across_chunks",
  "marigold-impl/tests/keep_first_n_edge_cases.rs::keep_first_n_cutoff_tie_keeps_the_earlier_item_and_drops_the_later",
]
note = "Tie clause fixed in #461. Not provable by kani as stated: the implementation is async and heap based."

[[invariant]]
id = "keep-first-n-largest-keys"
surface = "interface"
statement = "KeepFirstN returns at most N items, never repeats an input position, and the sequence of its items' sort keys is the descending sequence of the N largest keys of the stream, for every comparator-consistent stream; which of several items that tie under the comparator are kept is not part of this invariant."
status = "covered"
provable = "none"
covered_by = [
  "marigold-impl/tests/keep_first_n_edge_cases.rs::keep_first_n_is_bounded_descending_and_keeps_the_largest_keys_exhaustively",
  "marigold-impl/tests/keep_first_n_edge_cases.rs::keep_first_n_keeps_the_earliest_of_many_ties_across_chunks",
  "marigold-impl/tests/keep_first_n_edge_cases.rs::keep_first_n_cutoff_tie_keeps_the_earlier_item_and_drops_the_later",
  "marigold-impl/tests/keep_first_n_edge_cases.rs::keep_first_n_zero",
  "marigold-impl/tests/keep_first_n_edge_cases.rs::keep_first_n_exceeds_stream_length",
  "tests/src/lib.rs::tests::macro_keep_first_n_returns_the_largest_in_descending_order",
]

[[invariant]]
id = "permutations-count"
surface = "interface"
statement = "Permutable::permutations(k) over n items yields n!/(n-k)! items when k <= n and none when k > n, each with k distinct positions of the input, no two equal as position sequences; k = 0 yields exactly one empty item. Equal input values are distinct positions, so equal-valued outputs can repeat."
status = "covered"
provable = "lean"
covered_by = [
  "marigold-impl/tests/permutations_edge_cases.rs::permutations_count_is_n_falling_k_with_distinct_orderings_exhaustively",
  "marigold-impl/tests/permutations_edge_cases.rs::permutations_count_is_by_position_not_by_value",
  "marigold-impl/tests/permutations_edge_cases.rs::permutations_count_matches_formula",
  "marigold-impl/tests/permutations_edge_cases.rs::permutations_k_zero",
  "tests/src/lib.rs::tests::macro_permutation_and_combination_counts",
]

[[invariant]]
id = "combinations-count"
surface = "interface"
statement = "Combinable::combinations(k) over n items yields C(n,k) items, each a strictly position-increasing selection of k items, no two equal as position sets; k = 0 yields exactly one empty item and k > n none. Equal input values are distinct positions, so equal-valued outputs can repeat."
status = "covered"
provable = "lean"
covered_by = [
  "marigold-impl/tests/combinations_edge_cases.rs::combinations_count_is_binomial_with_no_two_equal_as_sets_exhaustively",
  "marigold-impl/tests/combinations_edge_cases.rs::combinations_count_is_by_position_not_by_value",
  "marigold-impl/tests/combinations_edge_cases.rs::combinations_k_zero",
  "marigold-impl/tests/combinations_edge_cases.rs::combinations_k_exceeds_n",
  "tests/src/lib.rs::tests::macro_permutation_and_combination_counts",
]

[[invariant]]
id = "multi-consumer-fanout"
surface = "interface"
statement = "With the tokio or async-std feature, every receiver from MultiConsumerStream::get observes every item of the source exactly once, in source order, and ends when the source ends."
status = "covered"
provable = "none"
covered_by = [
  "marigold-impl/src/multi_consumer_stream.rs::tests::runtime::multiple_consumers_each_receive_full_stream",
  "marigold-impl/src/multi_consumer_stream.rs::tests::runtime::single_consumer_receives_all_items_in_order",
  "marigold-impl/src/multi_consumer_stream.rs::tests::runtime::slow_consumer_does_not_lose_items",
  "marigold-impl/src/multi_consumer_stream.rs::tests::runtime::consumers_terminate_after_source_exhaustion",
  "marigold-impl/src/multi_consumer_stream.rs::tests::runtime::empty_source_produces_empty_consumers",
]

[[invariant]]
id = "permutations-with-replacement-count"
surface = "interface"
statement = "Permutable::permutations_with_replacement(k) over n items yields n^k items for k >= 1, each of length k, no two equal as position sequences; k = 0 yields no items (not one empty item, unlike permutations(0))."
status = "covered"
provable = "lean"
covered_by = [
  "marigold-impl/tests/permutations_edge_cases.rs::permutations_with_replacement_count_is_n_pow_k_for_positive_k_exhaustively",
  "marigold-impl/tests/permutations_edge_cases.rs::permutations_with_replacement_k_zero",
  "marigold-impl/tests/permutations_edge_cases.rs::permutations_with_replacement_count_matches_formula",
]


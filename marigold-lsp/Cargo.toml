[package]
name = "marigold-lsp"
version = "0.2.0"
edition = "2021"
authors = ["Dominic <code@dominic.computer>"]
description = "Language server for the marigold language."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/DominicBurkart/marigold"

[features]
telemetry = []
datadog = ["telemetry", "dep:ureq"]

[dependencies]
lsp-server = "=0.10.0"
lsp-types = "=0.97.0"
serde_json = "1"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"], optional = true }

[dependencies.marigold-grammar]
path = "../marigold-grammar"
version = "=0.2.0"

[dev-dependencies]
proptest = "1"

[advisories]
ignore = [
    # proc-macro-error unmaintained — used only by internal macros
    "RUSTSEC-2024-0370",
    # proc-macro-error2 (maintained fork) now also unmaintained — same scope
    "RUSTSEC-2026-0173",
    # bincode 1.x unmaintained — pulled in by iai-callgrind dev-dependency only
    "RUSTSEC-2025-0141",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
    "CC0-1.0",
]

[[licenses.exceptions]]
allow = ["LicenseRef-ring"]
name = "ring"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

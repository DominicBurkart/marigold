[package]
name = "marigold"
version = "0.2.0"
edition = "2021"
authors = ["Dominic <code@dominic.computer>"]
description = "The Marigold Programming Language."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/DominicBurkart/marigold"
# `tests/emit_cli.rs` includes a validator and reads programs from `marigold-grammar/tests`, which
# are not part of the published `marigold` crate.
exclude = ["tests/emit_cli.rs", "tests/golden/**"]

[features]
tokio = ["marigold-impl/tokio", "marigold-grammar/tokio"]
async-std = ["marigold-impl/async-std", "marigold-grammar/async-std"]
io = ["marigold-impl/io", "marigold-grammar/io", "marigold-macros/io"]
otel = ["marigold-impl/otel", "marigold-grammar/otel", "marigold-macros/otel"]
otel-otlp = ["otel", "marigold-impl/otel-otlp"]
# `marigold-grammar/io`: `marigold emit` must generate the code the `m!` macro generates under
# `marigold run` (the macro is built with grammar feature `io`, see `marigold emit --help`).
cli = ["clap", "convert_case", "home", "serde_json", "marigold-grammar/io"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.0.27", features = ["derive"], optional = true }
convert_case = { version="0.6.0", optional = true }
home = { version = "0.5.4", optional = true }
serde_json = { version = "1", optional = true }

[dependencies.marigold-grammar]
path = "../marigold-grammar"
version = "=0.2.0"

[dependencies.marigold-macros]
path = "../marigold-macros"
version = "=0.2.0"

[dependencies.marigold-impl]
path = "../marigold-impl"
version = "=0.2.0"

[dev-dependencies]
tokio = {version = "1", features = ["full"]}

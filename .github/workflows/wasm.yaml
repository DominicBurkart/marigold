name:                wasm

# push-only triggers left PRs whose branches were pushed by an app (no push
# event ⇒ no run) blocked forever on required checks. pull_request covers every
# PR regardless of how the head was pushed; push is kept for main so the
# default branch still gets a full run after each merge.
on: [push]

concurrency:
  group:             wasm-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR:  always

jobs:
  wasm:
    name:            WASM Build
    # Self-hosted fleet: label with exactly [self-hosted, Linux] — no arch
    # labels, the fleet spans arm64 and x86_64 hosts. The baked toolchain
    # already includes the wasm32-unknown-unknown target.
    runs-on:         [self-hosted, Linux]
    steps:
      - uses:        actions/checkout@v4
      - run:         cargo build --target wasm32-unknown-unknown

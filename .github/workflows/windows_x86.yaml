name:                windows_x86

# push-only triggers left PRs whose branches were pushed by an app (no push
# event => no run) blocked forever on required checks. pull_request covers
# every PR regardless of how the head was pushed; push is kept for main so the
# default branch still gets a full run after each merge.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group:             windows_x86-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR:  always

jobs:
  windows_x86:
    name:            Windows x86_64 Build
    runs-on:         windows-latest
    steps:
      - uses:        actions/checkout@v2
      - uses:        actions-rs/toolchain@v1
        with:
          toolchain: stable
          target:    x86_64-pc-windows-gnu
          override:  true
      - run:         cargo build
      - run:         cargo build --features tokio,io
      - run:         cargo build --features tokio
      - run:         cargo build --features async-std

name:                arm7

# push-only triggers left PRs whose branches were pushed by an app (no push
# event => no run) blocked forever on required checks. pull_request covers
# every PR regardless of how the head was pushed; push is kept for main so the
# default branch still gets a full run after each merge.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group:             arm7-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR:  always

jobs:
  linux_arm7:
    name:            Linux ARMv7 Build
    runs-on:         ubuntu-latest
    steps:
      - uses:        actions/checkout@v2
      - uses:        actions-rs/toolchain@v1
        with:
          toolchain: stable
          target:    armv7-unknown-linux-gnueabihf
          override:  true
      - uses:        actions-rs/cargo@v1
        with:
          use-cross: true
          command:   build
          args:      --target armv7-unknown-linux-gnueabihf
      - uses:        actions-rs/cargo@v1
        with:
          use-cross: true
          command:   build
          args:      --target armv7-unknown-linux-gnueabihf --features tokio,io
      - uses:        actions-rs/cargo@v1
        with:
          use-cross: true
          command:   build
          args:      --target armv7-unknown-linux-gnueabihf --features tokio
      - uses:        actions-rs/cargo@v1
        with:
          use-cross: true
          command:   build
          args:      --target armv7-unknown-linux-gnueabihf --features async-std

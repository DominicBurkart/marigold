name:                x86

# push-only triggers left PRs whose branches were pushed by an app (no push
# event => no run) blocked forever on required checks. pull_request covers
# every PR regardless of how the head was pushed; push is kept for main so the
# default branch still gets a full run after each merge.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group:             x86-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR:  always

jobs:
  linux_x86:
    name:            Linux x86 Build
    runs-on:         ubuntu-latest
    steps:
      - uses:        actions/checkout@v2
      - uses:        actions-rs/toolchain@v1
        with:
          toolchain: stable
          target:    x86_64-unknown-linux-gnu
          override:  true
      - uses:        actions-rs/cargo@v1
        with:
          use-cross: true
          command:   build
          args:      --target x86_64-unknown-linux-gnu
      - uses:        actions-rs/cargo@v1
        with:
          use-cross: true
          command:   build
          args:      --target x86_64-unknown-linux-gnu --features tokio,io
      - uses:        actions-rs/cargo@v1
        with:
          use-cross: true
          command:   build
          args:      --target x86_64-unknown-linux-gnu --features tokio
      - uses:        actions-rs/cargo@v1
        with:
          use-cross: true
          command:   build
          args:      --target x86_64-unknown-linux-gnu --features async-std

name: bench

# Benches on this device (dominicburkart/marigold#396): the required
# `Benches` check used to compare a PR's run against a baseline recorded by
# a *different* GitHub-hosted VM, which carried a systematic machine offset
# large enough to fail identical code. Both the baseline (push-to-main) and
# the comparison (same-repo pull_request) now run on the same dedicated,
# otherwise-idle, CPU-pinned self-hosted runner, so a comparison is always
# apples-to-apples. Baselines live on that runner's bind-mounted volume
# (exact-sha lookup, loud miss) instead of the GitHub Actions cache, so
# there's no silent restore-keys fallback to an unrelated older baseline.
#
# Security: per GitHub's guidance against using self-hosted runners with
# public repositories, the self-hosted path is restricted to trusted
# triggers only — push to main, and pull_request from this repository
# itself. A fork pull request never touches this machine; it falls back to
# an ubuntu-latest job that runs the benches with no comparison and says so.
# `bench-pr-trusted` and `bench-pr-fork` share the job name `Benches` with
# mutually exclusive `if:` conditions so exactly one always runs and
# reports — the required check never gets stuck "expected".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  cache-baseline:
    name: Save Criterion baseline
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, podman, bench]
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
    - name: Print CPU model
      run: lscpu

    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2

    - name: Criterion benches — save baseline
      run: cargo bench --bench keep_first_n --features tokio -- --save-baseline main
      working-directory: marigold-impl
    - run: cargo bench --bench per_item_costs --features tokio -- --save-baseline main
      working-directory: marigold-impl
    - run: cargo bench --bench pipeline_stages --features tokio -- --save-baseline main
      working-directory: marigold-impl
    - run: cargo bench --bench parser_bench -- --save-baseline main
      working-directory: marigold-grammar
    - run: cargo bench --bench color_picker_bench --features tokio -- --save-baseline main
      working-directory: examples/color-palette-picker
    - run: cargo bench --bench algorithms_bench --features tokio -- --save-baseline main
      working-directory: examples/algorithms

    - name: Custom benches — compile and run
      run: cargo bench --bench cpu_utilization --features tokio
      working-directory: marigold-impl
    - run: cargo bench --bench driver_worker_split --features "tokio,bench-instrumentation"
      working-directory: marigold-impl
    - run: cargo bench --bench otel_overhead --features "tokio,otel"
      working-directory: marigold-impl
    - run: cargo bench --bench map_filter_utilization --features tokio
      working-directory: marigold-impl

    - name: Publish baseline to the runner's persistent bench-baselines volume
      run: |
        set -euo pipefail
        # CARGO_TARGET_DIR is set to /cargo-target by this runner's container
        # (not the workspace-relative ./target), so that's where Criterion
        # actually wrote its output.
        dest="/bench-baselines/${GITHUB_SHA}"
        rm -rf "$dest"
        mkdir -p "$dest"
        cp -r "${CARGO_TARGET_DIR}/criterion" "$dest/criterion"
        # Bound disk use: keep the 30 most recent baselines.
        cd /bench-baselines
        ls -1t | tail -n +31 | xargs -r rm -rf --
        echo "Saved Criterion baseline for \`${GITHUB_SHA}\`." >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: criterion-reports
        path: /cargo-target/criterion/
        if-no-files-found: ignore
        retention-days: 3

  bench-pr-trusted:
    name: Benches
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, podman, bench]
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
    - name: Print CPU model
      run: lscpu

    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2

    - name: Test the regression-check scripts
      run: |
        bash marigold-impl/benches/test_paired_ab.sh
        cd marigold-impl/benches && python3 -B -m unittest test_check_paired_regression

    - name: Restore Criterion baseline (exact base-sha match, no fallback)
      id: restore-baseline
      run: |
        set -euo pipefail
        base_sha="${{ github.event.pull_request.base.sha }}"
        src="/bench-baselines/${base_sha}/criterion"
        if [ -d "$src" ]; then
          # CARGO_TARGET_DIR is /cargo-target on this runner (see cache-baseline).
          mkdir -p "${CARGO_TARGET_DIR}/criterion"
          cp -r "$src"/. "${CARGO_TARGET_DIR}/criterion/"
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
          {
            echo "### :warning: No benchmark baseline for \`${base_sha}\`"
            echo ""
            echo "Benches ran with no comparison. This repo-controlled runner only"
            echo "accepts an exact base-commit match (no restore-keys fallback to an"
            echo "unrelated baseline). A push to \`main\` publishes a fresh baseline"
            echo "for subsequent PRs."
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Criterion benches — compare to baseline
      if: steps.restore-baseline.outputs.found == 'true'
      run: cargo bench --bench keep_first_n --features tokio -- --baseline main 2>&1 | tee /tmp/bench_keep_first_n.txt
      working-directory: marigold-impl
    - if: steps.restore-baseline.outputs.found == 'true'
      run: cargo bench --bench per_item_costs --features tokio -- --baseline main 2>&1 | tee /tmp/bench_per_item_costs.txt
      working-directory: marigold-impl
    - if: steps.restore-baseline.outputs.found == 'true'
      run: cargo bench --bench pipeline_stages --features tokio -- --baseline main 2>&1 | tee /tmp/bench_pipeline_stages.txt
      working-directory: marigold-impl
    - if: steps.restore-baseline.outputs.found == 'true'
      run: cargo bench --bench parser_bench -- --baseline main 2>&1 | tee /tmp/bench_parser_bench.txt
      working-directory: marigold-grammar
    - if: steps.restore-baseline.outputs.found == 'true'
      run: cargo bench --bench color_picker_bench --features tokio -- --baseline main 2>&1 | tee /tmp/bench_color_picker_bench.txt
      working-directory: examples/color-palette-picker
    - if: steps.restore-baseline.outputs.found == 'true'
      shell: bash -eo pipefail {0}
      run: cargo bench --bench algorithms_bench --features tokio -- --baseline-lenient main 2>&1 | tee /tmp/bench_algorithms_bench.txt
      working-directory: examples/algorithms

    - name: Criterion benches — no baseline available
      if: steps.restore-baseline.outputs.found == 'false'
      run: |
        cargo bench --bench keep_first_n --features tokio
        cargo bench --bench per_item_costs --features tokio
        cargo bench --bench pipeline_stages --features tokio
      working-directory: marigold-impl
    - if: steps.restore-baseline.outputs.found == 'false'
      run: cargo bench --bench parser_bench
      working-directory: marigold-grammar
    - if: steps.restore-baseline.outputs.found == 'false'
      run: cargo bench --bench color_picker_bench --features tokio
      working-directory: examples/color-palette-picker
    - if: steps.restore-baseline.outputs.found == 'false'
      run: cargo bench --bench algorithms_bench --features tokio
      working-directory: examples/algorithms

    - name: Custom benches — compile and run
      run: cargo bench --bench cpu_utilization --features tokio
      working-directory: marigold-impl
    - run: cargo bench --bench driver_worker_split --features "tokio,bench-instrumentation"
      working-directory: marigold-impl
    - run: cargo bench --bench otel_overhead --features "tokio,otel"
      working-directory: marigold-impl
    - run: cargo bench --bench map_filter_utilization --features tokio
      working-directory: marigold-impl

    - name: Check for regressions
      id: first-pass
      if: steps.restore-baseline.outputs.found == 'true'
      continue-on-error: true
      run: |
        set -o pipefail
        bash marigold-impl/benches/check_regression.sh 15 $(ls /tmp/bench_*.txt 2>/dev/null || true) 2>&1 | tee /tmp/regress.out
    - name: Paired base-vs-head comparison of flagged benchmarks
      id: paired
      if: steps.first-pass.outcome == 'failure'
      continue-on-error: true
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        git fetch --no-tags --depth=1 origin "$BASE_SHA"
        {
          echo "### First-pass regression check failed"
          echo ""
          echo '```'
          cat /tmp/regress.out
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        bash marigold-impl/benches/paired_ab.sh /tmp/regress.out
    - name: Remove paired-comparison base worktree
      if: always() && steps.first-pass.outcome == 'failure'
      run: |
        git worktree remove --force "$RUNNER_TEMP/base" || true
        rm -rf "$RUNNER_TEMP/base" "$RUNNER_TEMP/base-target"
    - name: Fail if the paired comparison failed or could not run
      if: always() && steps.first-pass.outcome == 'failure' && steps.paired.outcome != 'success'
      run: |
        echo "The first pass flagged a regression and the paired base-vs-head comparison did not clear it."
        exit 1
    - name: No regression check performed
      if: steps.restore-baseline.outputs.found == 'false'
      run: echo "No baseline was available, so no regression check ran (see summary)."

  bench-pr-fork:
    name: Benches
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Print CPU model
      run: lscpu

    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2

    - name: Run benches (no comparison — fork pull request)
      run: |
        cargo bench --bench keep_first_n --features tokio
        cargo bench --bench per_item_costs --features tokio
        cargo bench --bench pipeline_stages --features tokio
      working-directory: marigold-impl
    - run: cargo bench --bench parser_bench
      working-directory: marigold-grammar
    - run: cargo bench --bench color_picker_bench --features tokio
      working-directory: examples/color-palette-picker
    - run: cargo bench --bench algorithms_bench --features tokio
      working-directory: examples/algorithms

    - name: Custom benches — compile and run
      run: cargo bench --bench cpu_utilization --features tokio
      working-directory: marigold-impl
    - run: cargo bench --bench driver_worker_split --features "tokio,bench-instrumentation"
      working-directory: marigold-impl
    - run: cargo bench --bench map_filter_utilization --features tokio
      working-directory: marigold-impl

    - name: Report why there's no comparison
      run: |
        {
          echo "### Benches: fork pull request"
          echo ""
          echo "For security, pull requests from forks never run on the dedicated"
          echo "self-hosted bench runner and are not compared against a baseline"
          echo "(see [#396](https://github.com/dominicburkart/marigold/issues/396))."
          echo "Raw numbers are in the job log / uploaded artifact; a same-repo"
          echo "push or pull request gets the full regression comparison."
        } >> "$GITHUB_STEP_SUMMARY"
